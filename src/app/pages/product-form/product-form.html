<div class="container py-4">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="card shadow-sm border-0">

        <div class="card-body p-4">

          <h3 class="mb-4">
            {{ isEditMode ? 'Editar producto' : 'Nuevo producto' }}
          </h3>

          <div
            *ngIf="errorMessage"
            class="alert alert-danger"
          >
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="save()">

            <div class="mb-3">
              <label
                for="nombre"
                class="form-label"
              >
                Nombre
              </label>

              <input
                type="text"
                id="nombre"
                name="nombre"
                class="form-control"
                [(ngModel)]="product.nombre"
                [disabled]="loading"
                required
              >
            </div>

            <div class="mb-3">
              <label
                for="modelo"
                class="form-label"
              >
                Modelo
              </label>

              <input
                type="text"
                id="modelo"
                name="modelo"
                class="form-control"
                [(ngModel)]="product.modelo"
                [disabled]="loading"
              >
            </div>

            <div class="mb-3">
              <label
                for="categoriaId"
                class="form-label"
              >
                Categoría
              </label>

              <input
                type="number"
                id="categoriaId"
                name="categoriaId"
                class="form-control"
                [(ngModel)]="product.categoriaId"
                [disabled]="loading"
                min="1"
                required
              >
            </div>

            <div class="mb-4">
              <label
                for="marcaId"
                class="form-label"
              >
                Marca
              </label>

              <input
                type="number"
                id="marcaId"
                name="marcaId"
                class="form-control"
                [(ngModel)]="product.marcaId"
                [disabled]="loading"
                min="1"
                required
              >
            </div>

            <div class="d-flex justify-content-end gap-2">

              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="cancel()"
                [disabled]="loading"
              >
                Cancelar
              </button>

              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="loading"
              >
                {{
                  loading
                    ? 'Guardando...'
                    : (isEditMode
                        ? 'Actualizar producto'
                        : 'Guardar producto')
                }}
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
