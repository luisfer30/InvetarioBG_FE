<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow border-0" style="width: 100%; max-width: 420px">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Inventario</h2>

        <p class="text-muted">Inicia sesión para continuar</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label for="correo" class="form-label"> Correo </label>

          <input type="email" class="form-control" id="correo" name="correo" [(ngModel)]="correo" placeholder="admin@inventory.com" />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label"> Contraseña </label>

          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Ingrese su contraseña"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          <span *ngIf="!loading"> Iniciar sesión </span>

          <span *ngIf="loading"> Ingresando... </span>
        </button>
      </form>
    </div>
  </div>
</div>
